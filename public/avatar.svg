<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Anime-style illustration of Nate Lewis">
  <defs>
    <clipPath id="c"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="190" fill="#e03131"/>
