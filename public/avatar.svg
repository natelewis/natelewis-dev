    <path d="M156 236 C176 222 190 226 200 232 C210 226 224 222 244 236 C228 248 172 248 156 236 Z" fill="#4a4744"/>
    <!-- nose -->
    <path d="M200 176 L192 206 Q200 212 208 206" fill="none" stroke="#c98f68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- happy eyes -->
    <path d="M140 172 Q160 150 180 172" fill="none" stroke="#2a2725" stroke-width="7" stroke-linecap="round"/>
    <path d="M220 172 Q240 150 260 172" fill="none" stroke="#2a2725" stroke-width="7" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="140" cy="200" rx="14" ry="7" fill="#e89a86" opacity=".6"/>
    <ellipse cx="260" cy="200" rx="14" ry="7" fill="#e89a86" opacity=".6"/>
