    <!-- glasses -->
    <g fill="none" stroke="#1c1b1a" stroke-width="8" stroke-linejoin="round">
      <rect x="126" y="146" width="64" height="44" rx="8"/>
      <rect x="210" y="146" width="64" height="44" rx="8"/>
      <path d="M190 164 Q200 158 210 164"/>
      <path d="M126 160 L110 156"/><path d="M274 160 L290 156"/>
