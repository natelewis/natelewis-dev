      <ellipse cx="254" cy="262" rx="12" ry="26" transform="rotate(-18 254 262)"/>
      <ellipse cx="200" cy="298" rx="26" ry="12"/>
      <ellipse cx="176" cy="280" rx="7" ry="16" transform="rotate(10 176 280)"/>
      <ellipse cx="224" cy="280" rx="7" ry="16" transform="rotate(-10 224 280)"/>
