    <!-- mouth -->
    <path d="M152 248 C168 282 232 282 248 248 Q200 260 152 248 Z" fill="#7a2c2c"/>
    <path d="M158 250 C172 268 228 268 242 250 Q200 258 158 250 Z" fill="#fff"/>
