    <path d="M216 152 L234 152" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/>
    <!-- beanie -->
    <path d="M98 118 C98 40 150 14 200 14 C250 14 302 40 302 118 Z" fill="#1c1b1a"/>
    <path d="M94 96 Q200 70 306 96 L306 124 Q200 100 94 124 Z" fill="#5f5b57"/>
